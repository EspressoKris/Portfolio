{% include base_path %}

<!-- start custom head snippets -->
{% assign meta_desc = page.description | default: page.excerpt | default: site.description %}
<meta name="description" content="{{ meta_desc | markdownify | strip_html | strip_newlines | strip | truncate: 200 | escape }}">
<link rel="icon" href="{{ base_path }}/images/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg">
<link rel="apple-touch-icon" href="{{ base_path }}/images/apple-touch-icon.png">
<meta name="theme-color" content="#0b3d5c">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">

<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ site.author.name | jsonify }},
  "jobTitle": "Postdoctoral Computational Biologist",
  "affiliation": {"@type": "Organization", "name": "MRC Weatherall Institute of Molecular Medicine, University of Oxford"},
  "url": {{ site.url | append: site.baseurl | jsonify }},
  "image": {{ site.author.avatar | prepend: "/images/" | prepend: base_path | jsonify }},
  "sameAs": [
    {{ site.author.orcid | jsonify }},
    {{ site.author.googlescholar | jsonify }},
    "https://github.com/{{ site.author.github }}",
    "https://www.linkedin.com/in/{{ site.author.linkedin }}"
  ]
}
</script>
<!-- end custom head snippets -->
